# Render Blueprint for the BactiFIND cloud server.
# The database is on Neon (free, does not expire) — see CLOUD_SETUP.md, "Database on Neon".
# Put the contents of this "server" folder in its own GitHub repository, then in Render:
# New → Blueprint → choose the repository.
services:
  - type: web
    name: bactifind-api
    runtime: node
    plan: free            # free instances sleep after ~15 min idle (first request then takes up to a minute)
    region: singapore     # closest Render region to India
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false       # Neon connection string (postgresql://…neon.tech/…?sslmode=require)
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAILS
        sync: false       # your admin email(s), comma-separated
      - key: ALLOWED_ORIGINS
        sync: false       # e.g. https://bactifindpremium.netlify.app,https://appassets.androidplatform.net
      - key: NODE_VERSION
        value: "20"
